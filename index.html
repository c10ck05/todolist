<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a66c2">
    <link rel="apple-touch-icon" href="./icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Todo✓">
    <style>
        :root {
            --bg: #f3f2ef;
            --card-bg: #ffffff;
            --text-primary: #1d2226;
            --text-secondary: #56687a;
            --input-border: #8896a4;
            --input-border-focus: #0a66c2;
            --input-bg: #ffffff;
            --btn-primary: #0a66c2;
            --btn-primary-hover: #004182;
            --btn-primary-text: #ffffff;
            --link-color: #0a66c2;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.15);
            --divider: #e0e0e0;
            --alert-error-bg: #fff0f0;
            --alert-error-color: #cc1016;
            --alert-error-border: #ffd0d0;
            --alert-success-bg: #f0faf0;
            --alert-success-color: #057642;
            --alert-success-border: #c6f0d8;
            --todo-item-bg: #f8f9fa;
            --todo-item-border: #e2e8f0;
            --todo-item-hover: #eef3f8;
            --tab-active-bg: #0a66c2;
            --tab-border: #0a66c2;
            --logout-bg: #fff0f0;
            --logout-color: #cc1016;
            --logout-border: #ffd0d0;
            --spinner-color: rgba(255,255,255,0.5);
            --overdue-bg: #fff4e5;
            --overdue-border: #f59e0b;
            --overdue-text: #92400e;
            --deadline-chip-bg: #e0f2fe;
            --deadline-chip-color: #0369a1;
            --deadline-picker-bg: #f0f7ff;
            --timeline-line: #cbd5e1;
            --timeline-dot: #0a66c2;
            --timeline-dot-overdue: #ef4444;
            --timeline-dot-today: #f59e0b;
            --timeline-dot-done: #10b981;
        }
        [data-theme="dark"] {
            --bg: #1b1f23;
            --card-bg: #283339;
            --text-primary: #e7e9ea;
            --text-secondary: #8b9197;
            --input-border: #546474;
            --input-border-focus: #70b5f9;
            --input-bg: #1e2a32;
            --btn-primary: #70b5f9;
            --btn-primary-hover: #9ecfff;
            --btn-primary-text: #1b1f23;
            --link-color: #70b5f9;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.5);
            --divider: #38434f;
            --alert-error-bg: #3d1f1f;
            --alert-error-color: #ff6b6b;
            --alert-error-border: #5c2a2a;
            --alert-success-bg: #1a3a2a;
            --alert-success-color: #5cc97e;
            --alert-success-border: #2a5c3a;
            --todo-item-bg: #1e2a32;
            --todo-item-border: #38434f;
            --todo-item-hover: #253340;
            --tab-active-bg: #70b5f9;
            --tab-border: #70b5f9;
            --logout-bg: #3d1f1f;
            --logout-color: #ff6b6b;
            --logout-border: #5c2a2a;
            --overdue-bg: #2d1f0a;
            --overdue-border: #d97706;
            --overdue-text: #fcd34d;
            --deadline-chip-bg: #1e3a4a;
            --deadline-chip-color: #7dd3fc;
            --deadline-picker-bg: #1a2a38;
            --timeline-line: #38434f;
            --timeline-dot: #70b5f9;
            --timeline-dot-overdue: #f87171;
            --timeline-dot-today: #fbbf24;
            --timeline-dot-done: #34d399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            transition: background 0.3s, color 0.3s;
        }
        .section {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }
        .section.active { display: flex; }
        #section-todo { max-width: 620px; }
        .theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            width: 44px; height: 44px;
            border-radius: 50%; border: none;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; z-index: 999;
        }
        .theme-toggle:hover { transform: scale(1.1); }
        .logo-wrap { margin-bottom: 20px; text-align: left; width: 100%; }
        .logo { display: inline-flex; align-items: center; gap: 4px; }
        .logo-text { font-size: 32px; font-weight: 800; color: var(--text-primary); letter-spacing: -1px; }
        .logo-badge { background: var(--btn-primary); color: var(--btn-primary-text); font-size: 18px; font-weight: 800; padding: 2px 8px 4px; border-radius: 4px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 36px 36px 32px;
            width: 100%;
            box-shadow: var(--card-shadow);
            transition: background 0.3s;
            animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
        .card-title { font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; letter-spacing: -0.5px; }
        .card-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
        .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; display: none; border: 1px solid; }
        .alert-error { background: var(--alert-error-bg); color: var(--alert-error-color); border-color: var(--alert-error-border); }
        .alert-success { background: var(--alert-success-bg); color: var(--alert-success-color); border-color: var(--alert-success-border); }
        .input-wrap { position: relative; margin-bottom: 14px; width: 100%; }
        .input-wrap input {
            width: 100%; padding: 15px 18px;
            border: 1px solid var(--input-border); border-radius: 8px;
            font-size: 16px; color: var(--text-primary); background: var(--input-bg);
            outline: none; transition: all 0.2s;
            -webkit-appearance: none; appearance: none; display: block;
        }
        .input-wrap input::placeholder { color: var(--text-secondary); }
        .input-wrap input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px rgba(10,102,194,0.12); }
        .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--link-color); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px; }
        .pw-toggle:hover { text-decoration: underline; }
        .email-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 14px; width: 100%; }
        .email-row .input-wrap { flex: 1; margin-bottom: 0; min-width: 0; }
        .btn-verify { flex-shrink: 0; padding: 0 18px; background: var(--card-bg); color: var(--link-color); border: 1px solid var(--link-color); border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn-verify:hover:not(:disabled) { background: var(--todo-item-hover); }
        .btn-verify:disabled { opacity: 0.5; cursor: not-allowed; }
        .link-blue { color: var(--link-color); font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; display: inline-block; margin-bottom: 16px; }
        .link-blue:hover { text-decoration: underline; }
        .btn-main { width: 100%; padding: 15px; background: var(--btn-primary); color: var(--btn-primary-text); border: none; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 8px; -webkit-appearance: none; display: block; }
        .btn-main:hover:not(:disabled) { background: var(--btn-primary-hover); }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
        .below-card { margin-top: 20px; font-size: 15px; color: var(--text-secondary); text-align: center; width: 100%; }
        .below-card a { color: var(--link-color); font-weight: 700; text-decoration: none; cursor: pointer; }
        .below-card a:hover { text-decoration: underline; }
        /* ========== 투두 컨테이너 ========== */
        .todo-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 28px 32px;
            width: 100%;
            box-shadow: var(--card-shadow);
            transition: background 0.3s;
            animation: fadeIn 0.35s ease;
        }
        .todo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        .todo-header-left { display: flex; align-items: center; gap: 10px; }
        .todo-logo-badge { background: var(--btn-primary); color: var(--btn-primary-text); font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
        .todo-title { font-size: 20px; font-weight: 700; color: var(--text-primary); }
        .btn-logout { padding: 7px 16px; background: var(--logout-bg); color: var(--logout-color); border: 1px solid var(--logout-border); border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn-logout:hover { opacity: 0.8; }
        .todo-input-row { display: flex; gap: 10px; margin-bottom: 16px; width: 100%; }
        .todo-input-row input { flex: 1; min-width: 0; padding: 13px 16px; border: 1px solid var(--input-border); border-radius: 8px; font-size: 15px; color: var(--text-primary); background: var(--input-bg); outline: none; transition: all 0.2s; -webkit-appearance: none; }
        .todo-input-row input::placeholder { color: var(--text-secondary); }
        .todo-input-row input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px rgba(10,102,194,0.12); }
        .btn-add { flex-shrink: 0; padding: 13px 22px; background: var(--btn-primary); color: var(--btn-primary-text); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn-add:hover:not(:disabled) { background: var(--btn-primary-hover); }
        .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }
        /* 필터 탭 */
        .filter-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab-btn { padding: 6px 18px; border: 1px solid var(--tab-border); border-radius: 20px; background: transparent; font-size: 13px; font-weight: 600; color: var(--link-color); cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--tab-active-bg); color: var(--btn-primary-text); }
        .tab-btn:hover:not(.active) { background: var(--todo-item-hover); }
        /* 투두 리스트 */
        .todo-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding-right: 2px; }
        .todo-list::-webkit-scrollbar { width: 4px; }
        .todo-list::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
        .todo-item {
            background: var(--todo-item-bg);
            border-radius: 10px;
            border: 1px solid var(--todo-item-border);
            transition: all 0.2s;
            animation: slideIn 0.25s ease;
            overflow: hidden;
            flex-shrink: 0; /* 항목이 많아도 세로로 눌리지 않고 스크롤되도록 */
        }
        @keyframes slideIn { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
        .todo-item:hover { background: var(--todo-item-hover); border-color: var(--input-border-focus); }
        .todo-item.overdue {
            background: var(--overdue-bg) !important;
            border-color: var(--overdue-border) !important;
        }
        .todo-item.overdue:hover { filter: brightness(0.97); }
        .todo-item-main { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
        .todo-item.completed { opacity: 0.65; }
        .todo-checkbox { width: 20px; height: 20px; min-width: 20px; border: 2px solid var(--input-border); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: var(--input-bg); }
        .todo-checkbox.checked { background: var(--btn-primary); border-color: var(--btn-primary); }
        .todo-checkbox.checked::after { content: "✓"; color: white; font-size: 12px; font-weight: 700; }
        .todo-content { flex: 1; min-width: 0; }
        .todo-text { font-size: 14px; color: var(--text-primary); word-break: break-word; }
        .todo-item.completed .todo-text { text-decoration: line-through; color: var(--text-secondary); }
        .todo-item.overdue .todo-text { color: var(--overdue-text); }
        /* 마감기한 칩 */
        .deadline-chip {
            display: inline-flex; align-items: center; gap: 4px;
            margin-top: 4px;
            font-size: 11px; font-weight: 600;
            padding: 2px 8px; border-radius: 20px;
            background: var(--deadline-chip-bg);
            color: var(--deadline-chip-color);
        }
        .deadline-chip.overdue {
            background: var(--overdue-bg);
            color: var(--overdue-text);
            border: 1px solid var(--overdue-border);
        }
        .todo-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .btn-deadline {
            padding: 4px 8px; background: none;
            border: 1px solid var(--todo-item-border);
            border-radius: 4px; color: var(--text-secondary);
            font-size: 13px; cursor: pointer; transition: all 0.2s;
            line-height: 1;
        }
        .btn-deadline:hover { border-color: var(--input-border-focus); color: var(--link-color); }
        .btn-deadline.active { border-color: var(--input-border-focus); color: var(--link-color); background: var(--deadline-chip-bg); }
        .btn-delete { padding: 4px 10px; background: none; border: 1px solid var(--todo-item-border); border-radius: 4px; color: var(--text-secondary); font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-delete:hover { border-color: var(--logout-border); color: var(--logout-color); background: var(--logout-bg); }
        /* 마감기한 picker 패널 */
        .deadline-panel {
            display: none;
            padding: 12px 15px 14px;
            background: var(--deadline-picker-bg);
            border-top: 1px solid var(--todo-item-border);
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .deadline-panel.open { display: flex; }
        .deadline-panel label { font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
        .deadline-panel input[type="datetime-local"] {
            flex: 1; min-width: 180px;
            padding: 7px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
            background: var(--input-bg);
            outline: none;
        }
        .deadline-panel input[type="datetime-local"]:focus { border-color: var(--input-border-focus); }
        .btn-deadline-save { padding: 7px 14px; background: var(--btn-primary); color: var(--btn-primary-text); border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn-deadline-save:hover { background: var(--btn-primary-hover); }
        .btn-deadline-remove { padding: 7px 10px; background: none; border: 1px solid var(--logout-border); color: var(--logout-color); border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn-deadline-remove:hover { background: var(--logout-bg); }
        /* 카테고리 / 반복 */
        .category-badge {
            display: inline-flex; align-items: center; gap: 3px;
            margin-top: 4px; margin-left: 6px;
            font-size: 11px; font-weight: 600;
            padding: 2px 8px; border-radius: 20px;
            background: var(--tab-active-bg); color: var(--btn-primary-text);
        }
        .repeat-icon { font-size: 11px; margin-left: 4px; opacity: 0.75; }
        .deadline-panel input[type="text"], .deadline-panel select {
            padding: 7px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
            background: var(--input-bg);
            outline: none;
        }
        .deadline-panel input[type="text"] { min-width: 120px; }
        .deadline-panel input[type="text"]:focus, .deadline-panel select:focus { border-color: var(--input-border-focus); }
        .todo-category-input {
            width: 130px; padding: 13px 14px;
            border: 1px solid var(--input-border); border-radius: 8px;
            font-size: 15px; color: var(--text-primary);
            background: var(--input-bg); outline: none;
            transition: all 0.2s; -webkit-appearance: none;
        }
        .todo-category-input::placeholder { color: var(--text-secondary); }
        .todo-category-input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px rgba(10,102,194,0.12); }
        /* 검색 / 정렬 도구 */
        .list-tools { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-input {
            flex: 1; padding: 9px 12px;
            border: 1px solid var(--input-border); border-radius: 8px;
            font-size: 14px; color: var(--text-primary);
            background: var(--input-bg); outline: none; transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--input-border-focus); }
        .sort-select {
            padding: 9px 12px; border: 1px solid var(--input-border); border-radius: 8px;
            font-size: 13px; color: var(--text-primary); background: var(--input-bg);
            cursor: pointer; outline: none;
        }
        /* 통계 바 */
        .stats-bar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            margin-bottom: 14px; padding: 12px 14px;
            background: var(--todo-item-bg); border: 1px solid var(--todo-item-border);
            border-radius: 10px; font-size: 13px; color: var(--text-secondary);
        }
        .stats-bar .stats-text { font-weight: 600; white-space: nowrap; }
        .stats-bar .stats-text b { color: var(--btn-primary); }
        .progress-track { flex: 1; min-width: 80px; height: 8px; background: var(--divider); border-radius: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--btn-primary); border-radius: 20px; transition: width 0.3s; }
        .stats-actions { display: flex; gap: 6px; }
        .stats-btn {
            padding: 5px 10px; border: 1px solid var(--todo-item-border); background: none;
            border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .stats-btn:hover { border-color: var(--input-border-focus); color: var(--link-color); }
        /* 우선순위 / D-day / 메모 */
        .priority-badge { display: inline-flex; align-items: center; gap: 3px; margin-top: 4px; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
        .priority-badge.p-high { background: #ffe3e0; color: #cc1016; }
        .priority-badge.p-low { background: #e3ecfa; color: #0a66c2; }
        :root[data-theme="dark"] .priority-badge.p-high { background: #4a2320; color: #ff9b93; }
        :root[data-theme="dark"] .priority-badge.p-low { background: #1e3352; color: #7fb0f0; }
        .dday-badge { display: inline-flex; align-items: center; margin-top: 4px; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--deadline-chip-bg); color: var(--deadline-chip-color); }
        .dday-badge.urgent { background: #ffe3e0; color: #cc1016; }
        :root[data-theme="dark"] .dday-badge.urgent { background: #4a2320; color: #ff9b93; }
        .memo-icon { font-size: 11px; margin-left: 4px; opacity: 0.7; }
        .deadline-panel textarea {
            width: 100%; min-height: 52px; resize: vertical; padding: 7px 10px;
            border: 1px solid var(--input-border); border-radius: 6px; font-size: 13px;
            color: var(--text-primary); background: var(--input-bg); outline: none; font-family: inherit;
        }
        .deadline-panel textarea:focus { border-color: var(--input-border-focus); }
        .edit-input {
            width: 100%; padding: 4px 8px; border: 1px solid var(--input-border-focus);
            border-radius: 6px; font-size: 14px; color: var(--text-primary);
            background: var(--input-bg); outline: none;
        }
        /* 헤더 우측 / 설정 버튼 */
        .todo-header-right { display: flex; align-items: center; gap: 8px; }
        .btn-settings { background: none; border: 1px solid var(--todo-item-border); border-radius: 8px; width: 34px; height: 34px; font-size: 15px; cursor: pointer; transition: all 0.2s; }
        .btn-settings:hover { border-color: var(--input-border-focus); }
        /* 서브태스크 */
        .subtask-section { width: 100%; margin-top: 4px; }
        .subtask-list { list-style: none; display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
        .subtask-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .subtask-check { width: 16px; height: 16px; min-width: 16px; border: 2px solid var(--input-border); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--input-bg); }
        .subtask-check.checked { background: var(--btn-primary); border-color: var(--btn-primary); }
        .subtask-check.checked::after { content: "✓"; color: #fff; font-size: 10px; font-weight: 700; }
        .subtask-text { flex: 1; color: var(--text-primary); word-break: break-word; }
        .subtask-item.done .subtask-text { text-decoration: line-through; color: var(--text-secondary); }
        .subtask-del { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
        .subtask-del:hover { color: var(--alert-error-color); }
        .subtask-add-row { display: flex; gap: 6px; }
        .subtask-add-row input { flex: 1; padding: 6px 9px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 13px; color: var(--text-primary); background: var(--input-bg); outline: none; }

        .cal-cell { min-height: 64px; border: 1px solid var(--todo-item-border); border-radius: 8px; padding: 4px; background: var(--todo-item-bg); cursor: pointer; overflow: hidden; transition: all 0.15s; }

        .cal-cell.today { border-color: var(--btn-primary); box-shadow: 0 0 0 1px var(--btn-primary) inset; }
        .cal-cell.selected { background: var(--todo-item-hover); border-color: var(--btn-primary); }
        .cal-daynum { font-size: 12px; font-weight: 600; color: var(--text-primary); }

        .cal-dot.done { background: var(--text-secondary); opacity: 0.5; }

        .cal-selected-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
        /* 모달 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-card { background: var(--card-bg); border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; box-shadow: var(--card-shadow); max-height: 90vh; overflow-y: auto; }

        .modal-section { padding: 14px 0; border-top: 1px solid var(--divider); }

        .modal-section-title.danger { color: var(--alert-error-color); }

        .modal-input { width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--input-border); border-radius: 8px; font-size: 14px; color: var(--text-primary); background: var(--input-bg); outline: none; }
        .modal-input:focus { border-color: var(--input-border-focus); }
        .modal-btn { padding: 9px 14px; border: 1px solid var(--todo-item-border); background: var(--input-bg); color: var(--text-primary); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }

        .modal-btn.danger:hover { background: var(--alert-error-bg); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

        #timeline-view { display: none; }

            display: flex;

        .timeline-item:not(:last-child) .timeline-line-col::after {

        .timeline-dot.today { background: var(--timeline-dot-today); box-shadow: 0 0 0 2px var(--timeline-dot-today); }
        .timeline-dot.done { background: var(--timeline-dot-done); box-shadow: 0 0 0 2px var(--timeline-dot-done); }
        .timeline-card {
            flex: 1; min-width: 0;
            margin-left: 10px;

        .timeline-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .timeline-card-text { font-size: 14px; color: var(--text-primary); font-weight: 500; flex: 1; min-width: 0; word-break: break-word; }
        .timeline-card.overdue .timeline-card-text { color: var(--overdue-text); }
        .timeline-card.done .timeline-card-text { text-decoration: line-through; color: var(--text-secondary); }
        .timeline-time {
            font-size: 11px; color: var(--text-secondary);
            white-space: nowrap; flex-shrink: 0;
            margin-top: 2px;
        }
        .timeline-card.overdue .timeline-time { color: var(--overdue-text); opacity: 0.8; }
        .timeline-badge {
            display: inline-block; margin-top: 6px;
            font-size: 10px; font-weight: 700;
            padding: 2px 7px; border-radius: 10px;
        }
        .timeline-badge.overdue-badge { background: var(--overdue-border); color: white; }
        .timeline-badge.today-badge { background: var(--timeline-dot-today); color: white; }
        .timeline-badge.done-badge { background: var(--timeline-dot-done); color: white; }
        /* 스피너 */
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--spinner-color); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 반응형 */
        @media (max-width: 540px) {
            body { padding: 16px 12px; justify-content: flex-start; padding-top: 64px; }

            .todo-container { padding: 22px 16px; }
            .card-title { font-size: 24px; }

            .btn-add { width: 100%; padding: 13px; }
            .theme-toggle { top: 12px; right: 12px; width: 40px; height: 40px; font-size: 18px; }
            .deadline-panel { flex-direction: column; align-items: stretch; }
            .deadline-panel input[type="datetime-local"] { min-width: unset; width: 100%; }
        }
    </style>

    <!-- ============================================================

    <style id="modern-redesign">
        /* ---- Redefined design tokens ---- */

        /* ---- Base ---- */

            <button class="btn-verify" id="btn-request-code" onclick="requestSignupCode()">인증 요청</button>
        </div>
        <div class="input-wrap"><input type="text" id="signup-code" placeholder="6자리 인증번호" maxlength="6"></div>
        <button class="btn-main" id="btn-signup" onclick="signup()">인증 및 가입 완료</button>
    </div>
    <div class="below-card">이미 계정이 있나요? &nbsp;<a onclick="showSection('section-login')">로그인 하러가기</a></div>
</div>

<!-- 비밀번호 재설정 -->
<div id="section-reset" class="section">
    <div class="logo-wrap"><div class="logo"><span class="logo-text">Todo</span><span class="logo-badge">✓</span></div></div>
    <div class="card">
        <div class="card-title">비밀번호 재설정</div>
        <div class="card-subtitle">가입할 때 사용한 이메일로 인증을 진행해 주세요</div>
        <div id="reset-alert" class="alert alert-error"></div>
        <div id="reset-success" class="alert alert-success"></div>
        <div class="email-row">
            <div class="input-wrap"><input type="email" id="reset-email" placeholder="가입한 이메일"></div>
            <button class="btn-verify" id="btn-request-reset-code" onclick="requestResetCode()">인증 요청</button>
        </div>
        <div class="input-wrap"><input type="text" id="reset-code" placeholder="6자리 인증번호" maxlength="6"></div>
        <div class="input-wrap">
            <input type="password" id="reset-new-password" placeholder="새 비밀번호">
            <button class="pw-toggle" onclick="togglePw('reset-new-password', this)">표시</button>
        </div>
        <button class="btn-main" id="btn-reset" onclick="resetPassword()">비밀번호 변경</button>
    </div>
    <div class="below-card"><a onclick="showSection('section-login')">← 로그인으로 돌아가기</a></div>
</div>

<!-- 투두 섹션 -->
<div id="section-todo" class="section">
    <div class="todo-container">
        <div class="todo-header">
            <div class="todo-header-left">
                <span class="todo-logo-badge">✓</span>
                <span class="todo-title">나의 투두리스트</span>
            </div>
            <div class="todo-header-right">
                <button class="btn-settings" onclick="openSettings()" title="설정">⚙️</button>
                <button class="btn-logout" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <div class="todo-input-row">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요...">
            <input type="text" id="todo-category" class="todo-category-input" placeholder="카테고리(선택)" list="category-list">
            <input type="datetime-local" id="todo-deadline" aria-label="마감기한 (선택)" title="마감기한 (선택)">

        </div>
        <datalist id="category-list"></datalist>
        <div class="filter-tabs">
            <button class="tab-btn" onclick="filterTodos('all', this)">전체</button>
            <button class="tab-btn active" onclick="filterTodos('active', this)">할 일</button>
            <button class="tab-btn" onclick="filterTodos('completed', this)">완료</button>
            <button class="tab-btn" onclick="filterTodos('overdue', this)">마감초과</button>
            <button class="tab-btn" id="tab-timeline" onclick="switchToTimeline(this)">타임라인</button>
            <button class="tab-btn" id="tab-calendar" onclick="switchToCalendar(this)">캘린더</button>
        </div>
        <div class="filter-tabs" id="category-filters"></div>

            <input type="text" id="search-input" class="search-input" placeholder="🔍 검색..." oninput="render()">
            <select id="sort-select" class="sort-select" onchange="render()">
                <option value="default">등록순</option>
                <option value="deadline">마감임박순</option>
                <option value="priority">우선순위순</option>
                <option value="name">가나다순</option>
            </select>

        <ul class="todo-list" id="todo-list"></ul>

        <div id="calendar-view"></div>
    </div>
</div>

<!-- 설정 모달 -->
<div id="settings-modal" class="modal-overlay" onclick="if(event.target===this)closeSettings()">
    <div class="modal-card">
        <div class="modal-title">설정</div>
        <div id="settings-alert" class="alert alert-error"></div>

        <div class="modal-section">
            <div class="modal-section-title">데이터</div>
            <div class="modal-row">
                <button class="modal-btn" onclick="exportData()">내보내기 (JSON)</button>
                <button class="modal-btn" onclick="document.getElementById('import-file').click()">가져오기</button>
                <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(this)">
            </div>
        </div>

        <div class="modal-section">
            <div class="modal-section-title">비밀번호 변경</div>
            <input type="password" id="cur-pw" class="modal-input" placeholder="현재 비밀번호">
            <input type="password" id="new-pw" class="modal-input" placeholder="새 비밀번호 (4자 이상)">
            <button class="modal-btn primary" onclick="changePassword()">비밀번호 변경</button>
        </div>

        <div class="modal-section">
            <div class="modal-section-title danger">위험 구역</div>
            <button class="modal-btn danger" onclick="deleteAccount()">계정 삭제</button>
        </div>

        <button class="modal-close" onclick="closeSettings()">닫기</button>
    </div>
</div>

<script>
    // PWA 서비스워커 등록 (http/https에서만 동작, file://에서는 무시)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    const API_BASE = "https://todolist-ezpr.onrender.com";
    let currentFilter = 'active';
    let currentCategory = 'all';
    let todos = [];
    let viewMode = 'list'; // 'list' | 'timeline' | 'calendar'
    let calendarDate = new Date();
    let selectedCalKey = null;
    const openPanels = new Set(); // 열려있는 상세 패널 id (재렌더 후에도 유지)
    const REPEAT_LABELS = { none: '', daily: '매일', weekly: '매주', monthly: '매월' };

    // =====================
    // 다크모드
    // =====================
    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('theme-btn').textContent = isDark ? '🌑' : '☀️';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }
    (function () {
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀️' : '🌑';
        });
    })();

    function togglePw(id, btn) {
        const el = document.getElementById(id);
        el.type = el.type === 'password' ? 'text' : 'password';
        btn.textContent = el.type === 'password' ? '표시' : '숨기기';
    }
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function showAlert(id, msg, type = 'error') {
        const el = document.getElementById(id);
        el.className = `alert alert-${type}`;
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }
    function setLoading(btnId, loading, text) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.innerHTML = loading ? `<span class="spinner"></span> 처리중...` : text;
    }

    document.addEventListener('DOMContentLoaded', () => {
        ['login-username', 'login-password'].forEach(id =>
            document.getElementById(id)?.addEventListener('keydown', e => e.key === 'Enter' && login())
        );
        ['signup-username', 'signup-password', 'signup-code'].forEach(id =>
            document.getElementById(id)?.addEventListener('keydown', e => e.key === 'Enter' && signup())
        );
        document.getElementById('signup-email')?.addEventListener('keydown', e => e.key === 'Enter' && requestSignupCode());
        ['reset-code', 'reset-new-password'].forEach(id =>
            document.getElementById(id)?.addEventListener('keydown', e => e.key === 'Enter' && resetPassword())
        );
        document.getElementById('reset-email')?.addEventListener('keydown', e => e.key === 'Enter' && requestResetCode());
        document.getElementById('todo-input')?.addEventListener('keydown', e => e.key === 'Enter' && addTodo());
    });

    // =====================
    // 로그인 / 회원가입 / 재설정
    // =====================
    async function login() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        if (!username || !password) { showAlert('login-alert', '아이디와 비밀번호를 입력해주세요.'); return; }
        setLoading('btn-login', true, '로그인');
        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('login-alert', data.detail || '로그인 실패'); return; }
            localStorage.setItem('token', data.access_token);
            showSection('section-todo');
            loadTodos();
        } catch { showAlert('login-alert', '서버 오류가 발생했습니다.'); }
        finally { setLoading('btn-login', false, '로그인'); }
    }

    async function requestSignupCode() {
        const email = document.getElementById('signup-email').value.trim();
        if (!email) { showAlert('signup-alert', '이메일을 입력해주세요.'); return; }
        const btn = document.getElementById('btn-request-code');
        btn.disabled = true; btn.textContent = '발송중...';
        try {
            const res = await fetch(`${API_BASE}/request-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('signup-alert', data.detail || '요청 실패'); btn.disabled = false; btn.textContent = '인증 요청'; return; }
            showAlert('signup-success', '인증번호가 발송되었습니다!', 'success');
            startCooldown(btn, 180);
        } catch { showAlert('signup-alert', '서버 오류'); btn.disabled = false; btn.textContent = '인증 요청'; }
    }

    async function signup() {
        const username = document.getElementById('signup-username').value.trim();
        const password = document.getElementById('signup-password').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const code = document.getElementById('signup-code').value.trim();
        if (!username || !password || !email || !code) { showAlert('signup-alert', '모든 항목을 입력해주세요.'); return; }
        setLoading('btn-signup', true, '인증 및 가입 완료');
        try {
            const res = await fetch(`${API_BASE}/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email, code })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('signup-alert', data.detail || '회원가입 실패'); return; }
            showAlert('signup-success', '회원가입 성공! 로그인 해주세요.', 'success');
            setTimeout(() => showSection('section-login'), 1500);
        } catch { showAlert('signup-alert', '서버 오류가 발생했습니다.'); }
        finally { setLoading('btn-signup', false, '인증 및 가입 완료'); }
    }

    async function requestResetCode() {
        const email = document.getElementById('reset-email').value.trim();
        if (!email) { showAlert('reset-alert', '이메일을 입력해주세요.'); return; }
        const btn = document.getElementById('btn-request-reset-code');
        btn.disabled = true; btn.textContent = '발송중...';
        try {
            const res = await fetch(`${API_BASE}/request-reset-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('reset-alert', data.detail || '요청 실패'); btn.disabled = false; btn.textContent = '인증 요청'; return; }
            showAlert('reset-success', '인증번호가 발송되었습니다!', 'success');
            startCooldown(btn, 180);
        } catch { showAlert('reset-alert', '서버 오류'); btn.disabled = false; btn.textContent = '인증 요청'; }
    }

    async function resetPassword() {
        const email = document.getElementById('reset-email').value.trim();
        const code = document.getElementById('reset-code').value.trim();
        const new_password = document.getElementById('reset-new-password').value.trim();
        if (!email || !code || !new_password) { showAlert('reset-alert', '모든 항목을 입력해주세요.'); return; }
        setLoading('btn-reset', true, '비밀번호 변경');
        try {
            const res = await fetch(`${API_BASE}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, new_password })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('reset-alert', data.detail || '재설정 실패'); return; }
            showAlert('reset-success', '비밀번호가 변경되었습니다!', 'success');
            setTimeout(() => showSection('section-login'), 1500);
        } catch { showAlert('reset-alert', '서버 오류가 발생했습니다.'); }
        finally { setLoading('btn-reset', false, '비밀번호 변경'); }
    }

    function startCooldown(btn, seconds) {
        let count = seconds;
        const timer = setInterval(() => {
            btn.textContent = `재요청 (${count}s)`;
            count--;
            if (count < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '인증 요청'; }
        }, 1000);
    }

    // =====================
    // 투두 CRUD
    // =====================
    async function loadTodos() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 401) { logout(); return; }
            todos = await res.json();
            render();
        } catch (e) { console.error(e); }
    }

    async function addTodo() {
        const input = document.getElementById('todo-input');
        const catInput = document.getElementById('todo-category');
        const deadlineInput = document.getElementById('todo-deadline');

        const content = input.value.trim();
        if (!content) { input.style.borderColor = '#cc1016'; setTimeout(() => input.style.borderColor = '', 1000); return; }

        const category = catInput.value.trim() || null;
        const deadline = deadlineInput.value || null;

        const btn = document.getElementById('btn-add-todo');
        if (btn.disabled) return;
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>`;

        const token = localStorage.getItem('token');

        try {
            const res = await fetch(`${API_BASE}/todos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ content, category, deadline })
            });

            if (res.status === 401) { logout(); return; }

            const newTodo = await res.json();
            todos.push(newTodo);

            input.value = '';
            catInput.value = '';
            deadlineInput.value = '';

            render();
        } catch (e) {
            console.error(e);
        } finally {
            btn.disabled = false; btn.innerHTML = '+ 등록';
        }
    }

    // 카테고리 / 반복 수정 (PATCH /todos/{id})
    async function updateTodoField(id, patch) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(patch)
            });
            if (!res.ok) return;
            const updated = await res.json();
            const todo = todos.find(t => t.id === id);
            if (todo) Object.assign(todo, updated);
            render();
        } catch (e) { console.error(e); }
    }
    function updateCategory(id, value) { updateTodoField(id, { category: value.trim() || null }); }
    function updateRepeat(id, value) { updateTodoField(id, { repeat: value }); }
    function updatePriority(id, value) { updateTodoField(id, { priority: parseInt(value, 10) }); }
    function updateDetail(id, value) { updateTodoField(id, { detail: value.trim() || null }); }

    async function toggleTodo(id) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos/${id}/toggle`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;
            const updated = await res.json();
            const todo = todos.find(t => t.id === id);
            if (todo) todo.completed = updated.completed;
            // 반복 투두 완료 시 서버가 만든 다음 회차를 목록에 추가
            if (updated.spawned) todos.push(updated.spawned);
            render();
        } catch (e) { console.error(e); }
    }

    async function deleteTodo(id) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;
            todos = todos.filter(t => t.id !== id);
            render();
        } catch (e) { console.error(e); }
    }

    // =====================
    // 마감기한
    // =====================
    function fillDeadlineInput(id) {
        const todo = todos.find(t => t.id === id);
        const input = document.getElementById(`deadline-input-${id}`);
        if (todo?.deadline && input)
            input.value = todo.deadline.slice(0, 16);
    }

    function toggleDeadlinePanel(id) {
        if (openPanels.has(id)) openPanels.delete(id);
        else openPanels.add(id);
        applyOpenPanels();
    }

    // 재렌더 후에도 열려있던 패널 상태를 복원
    function applyOpenPanels() {
        document.querySelectorAll('.deadline-panel').forEach(p => p.classList.remove('open'));
        document.querySelectorAll('.btn-deadline').forEach(b => b.classList.remove('active'));
        openPanels.forEach(id => {
            const panel = document.getElementById(`deadline-panel-${id}`);
            const btn = document.getElementById(`btn-deadline-${id}`);
            if (!panel) { openPanels.delete(id); return; }
            panel.classList.add('open');
            if (btn) btn.classList.add('active');
            fillDeadlineInput(id);
        });
    }

    async function saveDeadline(id) {
        const input = document.getElementById(`deadline-input-${id}`);
        const val = input.value; // "2024-01-01T15:00" 형식 (로컬 시간)
        if (!val) { alert('날짜와 시간을 선택해주세요.'); return; }
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos/${id}/deadline`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                // ✅ 핵심 수정: toISOString() 제거 → 로컬 시간 문자열 그대로 전송
                body: JSON.stringify({ deadline: val })
            });
            if (!res.ok) return;
            const updated = await res.json();
            const todo = todos.find(t => t.id === id);
            if (todo) todo.deadline = updated.deadline;
            render();
        } catch (e) { console.error(e); }
    }

    async function removeDeadline(id) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos/${id}/deadline`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ deadline: null })
            });
            if (!res.ok) return;
            const todo = todos.find(t => t.id === id);
            if (todo) todo.deadline = null;
            render();
        } catch (e) { console.error(e); }
    }

    // =====================
    // 필터 / 뷰 전환
    // =====================
    // 뷰(리스트/타임라인/캘린더)에 따라 화면 요소 표시 전환
    function applyViewVisibility() {
        const isList = viewMode === 'list';
        document.getElementById('todo-list').style.display = isList ? '' : 'none';
        document.querySelector('.list-tools').style.display = isList ? 'flex' : 'none';
        document.getElementById('stats-bar').style.display = isList ? '' : 'none';
        document.getElementById('timeline-view').classList.toggle('active', viewMode === 'timeline');
        document.getElementById('calendar-view').classList.toggle('active', viewMode === 'calendar');
        document.getElementById('category-filters').style.display = isList ? '' : 'none';
    }

    function filterTodos(filter, btn) {
        viewMode = 'list';
        currentFilter = filter;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyViewVisibility();
        render();
    }

    function switchToTimeline(btn) {
        viewMode = 'timeline';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyViewVisibility();
        renderTimeline();
    }

    function switchToCalendar(btn) {
        viewMode = 'calendar';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyViewVisibility();
        renderCalendar();
    }

    function isOverdue(todo) {
        if (!todo.deadline || todo.completed) return false;
        return new Date(todo.deadline) < new Date();
    }

    function formatDeadline(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        const isOD = d < new Date();
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const hour = d.getHours().toString().padStart(2, '0');
        const min = d.getMinutes().toString().padStart(2, '0');
        return `${isOD ? '⚠️ ' : '⏰ '}${month}/${day} ${hour}:${min}`;
    }

    // 우선순위 (0=낮음, 1=보통, 2=높음)
    const PRIORITY_LABELS = { 0: '낮음', 1: '보통', 2: '높음' };
    function priorityBadge(p) {
        if (p === 2) return `<span class="priority-badge p-high">🔴 높음</span>`;
        if (p === 0) return `<span class="priority-badge p-low">🔵 낮음</span>`;
        return '';
    }
    function priorityOptions(selected) {
        const sel = (selected == null) ? 1 : selected;
        return [[2, '높음'], [1, '보통'], [0, '낮음']].map(([v, l]) =>
            `<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`
        ).join('');
    }

    // D-day 뱃지
    function ddayBadge(isoStr, completed) {
        if (!isoStr || completed) return '';
        const target = new Date(isoStr);
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const day0 = new Date(target); day0.setHours(0, 0, 0, 0);
        const diff = Math.round((day0 - today) / 86400000);
        let label;
        if (diff === 0) label = 'D-DAY';
        else if (diff > 0) label = `D-${diff}`;
        else label = `D+${-diff}`;
        return `<span class="dday-badge ${diff <= 0 ? 'urgent' : ''}">${label}</span>`;
    }

    // 검색 + 정렬 적용
    function applySort(arr) {
        const mode = document.getElementById('sort-select').value;
        const copy = [...arr];
        if (mode === 'deadline') {
            copy.sort((a, b) => {
                if (!a.deadline && !b.deadline) return a.id - b.id;
                if (!a.deadline) return 1;
                if (!b.deadline) return -1;
                return new Date(a.deadline) - new Date(b.deadline);
            });
        } else if (mode === 'priority') {
            copy.sort((a, b) => (b.priority ?? 1) - (a.priority ?? 1) || a.id - b.id);
        } else if (mode === 'name') {
            copy.sort((a, b) => a.content.localeCompare(b.content, 'ko'));
        }
        // default(등록순): 서버/드래그로 정해진 todos 배열 순서를 그대로 유지
        return copy;
    }

    // 통계 바
    function renderStats() {
        const bar = document.getElementById('stats-bar');
        const total = todos.length;
        if (total === 0) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        const done = todos.filter(t => t.completed).length;
        const pct = Math.round((done / total) * 100);
        bar.innerHTML = `
            <span class="stats-text"><b>${done}</b>/${total} 완료 (${pct}%) · 남은 <b>${total - done}</b></span>
            <span class="progress-track"><span class="progress-fill" style="width:${pct}%"></span></span>
            <span class="stats-actions">
                <button class="stats-btn" onclick="completeAll()">전체 완료</button>
                <button class="stats-btn" onclick="clearCompleted()">완료 삭제</button>
            </span>`;
    }

    // 인라인 수정
    function startEdit(id, el) {
        const todo = todos.find(t => t.id === id);
        if (!todo) return;
        const input = document.createElement('input');
        input.className = 'edit-input';
        input.value = todo.content;
        el.replaceWith(input);
        input.focus();
        input.select();
        let done = false;
        const commit = async (save) => {
            if (done) return; done = true;
            const val = input.value.trim();
            if (save && val && val !== todo.content) {
                await updateTodoField(id, { content: val });
            } else { render(); }
        };
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') commit(true);
            if (e.key === 'Escape') commit(false);
        });
        input.addEventListener('blur', () => commit(true));
    }

    // 일괄 처리
    async function completeAll() {
        const targets = todos.filter(t => !t.completed);
        if (targets.length === 0) return;
        if (!confirm(`할 일 ${targets.length}개를 모두 완료 처리할까요?`)) return;
        const token = localStorage.getItem('token');
        await Promise.all(targets.map(t =>
            fetch(`${API_BASE}/todos/${t.id}/toggle`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}` } })
        ));
        loadTodos();
    }
    async function clearCompleted() {
        const targets = todos.filter(t => t.completed);
        if (targets.length === 0) { alert('완료된 항목이 없습니다.'); return; }
        if (!confirm(`완료된 항목 ${targets.length}개를 삭제할까요?`)) return;
        const token = localStorage.getItem('token');
        await Promise.all(targets.map(t =>
            fetch(`${API_BASE}/todos/${t.id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } })
        ));
        todos = todos.filter(t => !t.completed);
        render();
    }

    // =====================
    // 서브태스크 (체크리스트)
    // =====================
    function subtaskProgress(t) {
        const subs = t.subtasks || [];
        if (subs.length === 0) return '';
        const done = subs.filter(s => s.completed).length;
        return `<span class="subtask-progress">☑ ${done}/${subs.length}</span>`;
    }

    function subtaskSection(t) {
        const subs = t.subtasks || [];
        const items = subs.map(s => `
            <li class="subtask-item ${s.completed ? 'done' : ''}">
                <div class="subtask-check ${s.completed ? 'checked' : ''}" onclick="toggleSubtask(${t.id}, ${s.id}, ${!s.completed})"></div>
                <span class="subtask-text">${escapeHtml(s.content)}</span>
                <button class="subtask-del" onclick="deleteSubtask(${t.id}, ${s.id})">✕</button>
            </li>`).join('');
        return `
            <div class="subtask-section">
                <ul class="subtask-list">${items}</ul>
                <div class="subtask-add-row">
                    <input type="text" id="subtask-input-${t.id}" placeholder="하위 항목 추가..." onkeydown="if(event.key==='Enter')addSubtask(${t.id})">
                    <button onclick="addSubtask(${t.id})">추가</button>
                </div>
            </div>`;
    }

    async function addSubtask(todoId) {
        const input = document.getElementById(`subtask-input-${todoId}`);
        const content = input.value.trim();
        if (!content) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/todos/${todoId}/subtasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ content })
            });
            if (!res.ok) return;
            const sub = await res.json();
            const todo = todos.find(t => t.id === todoId);
            if (todo) { todo.subtasks = todo.subtasks || []; todo.subtasks.push(sub); }
            render();
        } catch (e) { console.error(e); }
    }

    async function toggleSubtask(todoId, subId, completed) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/subtasks/${subId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ completed })
            });
            if (!res.ok) return;
            const todo = todos.find(t => t.id === todoId);
            const sub = todo?.subtasks?.find(s => s.id === subId);
            if (sub) sub.completed = completed;
            render();
        } catch (e) { console.error(e); }
    }

    async function deleteSubtask(todoId, subId) {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/subtasks/${subId}`, {
                method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return;
            const todo = todos.find(t => t.id === todoId);
            if (todo) todo.subtasks = (todo.subtasks || []).filter(s => s.id !== subId);
            render();
        } catch (e) { console.error(e); }
    }

    // =====================
    // 드래그 정렬 (등록순 + 필터/검색 없을 때만)
    // =====================
    function canDrag() {
        return document.getElementById('sort-select').value === 'default'
            && currentFilter === 'all' && currentCategory === 'all'
            && !document.getElementById('search-input').value.trim();
    }
    let dragId = null;
    function onDragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); }
    function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.todo-item.drag-over').forEach(el => el.classList.remove('drag-over')); }
    function onDragOver(e, id) { e.preventDefault(); }
    function onDragEnter(e, id) { if (id !== dragId) e.currentTarget.classList.add('drag-over'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    async function onDrop(e, targetId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        if (dragId === null || dragId === targetId) return;
        const from = todos.findIndex(t => t.id === dragId);
        const to = todos.findIndex(t => t.id === targetId);
        if (from < 0 || to < 0) return;
        const [moved] = todos.splice(from, 1);
        todos.splice(to, 0, moved);
        dragId = null;
        render();
        // 서버에 새 순서 저장
        const token = localStorage.getItem('token');
        try {
            await fetch(`${API_BASE}/todos/reorder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ order: todos.map(t => t.id) })
            });
        } catch (err) { console.error(err); }
    }

    // =====================
    // 리스트 렌더링
    // =====================
    // 현재 존재하는 카테고리 목록 (사용 중인 카테고리들)
    function getCategories() {
        return [...new Set(todos.map(t => t.category).filter(Boolean))].sort();
    }

    function repeatOptions(selected) {
        return Object.entries(REPEAT_LABELS).map(([val, label]) =>
            `<option value="${val}" ${val === (selected || 'none') ? 'selected' : ''}>${val === 'none' ? '없음' : label}</option>`
        ).join('');
    }

    // 카테고리 필터 칩 + 입력 자동완성(datalist) 갱신
    function renderCategoryChips() {
        const cats = getCategories();
        const container = document.getElementById('category-filters');
        if (cats.length === 0) { container.innerHTML = ''; currentCategory = 'all'; }
        else {
            const chips = [['all', '전체 카테고리'], ...cats.map(c => [c, c]), ['none', '미분류']];
            container.innerHTML = chips.map(([val, label]) =>
                `<button class="tab-btn ${currentCategory === val ? 'active' : ''}" onclick="filterByCategory('${encodeURIComponent(val)}', this)">${escapeHtml(label)}</button>`
            ).join('');
        }
        document.getElementById('category-list').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
    }

    function filterByCategory(encoded, btn) {
        currentCategory = decodeURIComponent(encoded);
        document.querySelectorAll('#category-filters .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        renderCategoryChips();
        if (viewMode === 'timeline') { renderTimeline(); return; }
        if (viewMode === 'calendar') { renderCalendar(); return; }
        renderStats();
        const list = document.getElementById('todo-list');
        const q = document.getElementById('search-input').value.trim().toLowerCase();
        let filtered = todos;
        if (currentFilter === 'active')    filtered = filtered.filter(t => !t.completed);
        if (currentFilter === 'completed') filtered = filtered.filter(t => t.completed);
        if (currentFilter === 'overdue')   filtered = filtered.filter(t => isOverdue(t));
        if (currentCategory === 'none')     filtered = filtered.filter(t => !t.category);
        else if (currentCategory !== 'all') filtered = filtered.filter(t => t.category === currentCategory);
        if (q) filtered = filtered.filter(t => t.content.toLowerCase().includes(q));
        filtered = applySort(filtered);
        if (filtered.length === 0) {
            const msg = q ? `'${escapeHtml(q)}' 검색 결과가 없어요.`
                : ({ all: '할 일을 추가해보세요!', active: '할 일이 없어요!', completed: '완료된 항목이 없어요!', overdue: '마감 초과된 항목이 없어요! 🎉' }[currentFilter] || '할 일을 추가해보세요!');
            const emoji = q ? '🔍' : ({ all: '📋', active: '✨', completed: '🎉', overdue: '✅' }[currentFilter] || '📋');
            list.innerHTML = `<div class="empty-state"><div class="emoji">${emoji}</div><p>${msg}</p></div>`;
            return;
        }
        const dragEnabled = canDrag();
        list.innerHTML = filtered.map(t => {
            const overdue = isOverdue(t);
            const chipHtml = t.deadline
                ? `<span class="deadline-chip ${overdue ? 'overdue' : ''}">${formatDeadline(t.deadline)}</span>`
                : '';
            const catHtml = t.category ? `<span class="category-badge">🏷 ${escapeHtml(t.category)}</span>` : '';
            const repeatHtml = (t.repeat && t.repeat !== 'none') ? `<span class="repeat-icon">🔁 ${REPEAT_LABELS[t.repeat]}</span>` : '';
            const memoHtml = t.detail ? `<span class="memo-icon" title="${escapeHtml(t.detail)}">📝</span>` : '';
            const dragAttrs = dragEnabled
                ? `draggable="true" ondragstart="onDragStart(event, ${t.id})" ondragend="onDragEnd(event)" ondragover="onDragOver(event, ${t.id})" ondragenter="onDragEnter(event, ${t.id})" ondragleave="onDragLeave(event)" ondrop="onDrop(event, ${t.id})"`
                : '';
            const handleHtml = dragEnabled ? `<span class="drag-handle" title="드래그하여 순서 변경">⠿</span>` : '';
            return `
            <li class="todo-item ${t.completed ? 'completed' : ''} ${overdue ? 'overdue' : ''}" ${dragAttrs}>
                <div class="todo-item-main">
                    ${handleHtml}
                    <div class="todo-checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTodo(${t.id})"></div>
                    <div class="todo-content">
                        <div class="todo-text" ondblclick="startEdit(${t.id}, this)" title="더블클릭하여 수정">${escapeHtml(t.content)}${repeatHtml}${memoHtml}${subtaskProgress(t)}</div>
                        ${chipHtml}${ddayBadge(t.deadline, t.completed)}${priorityBadge(t.priority)}${catHtml}
                    </div>
                    <div class="todo-actions">
                        <button class="btn-deadline ${t.deadline ? 'active' : ''}" id="btn-deadline-${t.id}" onclick="toggleDeadlinePanel(${t.id})">📅</button>
                        <button class="btn-delete" onclick="deleteTodo(${t.id})">삭제</button>
                    </div>
                </div>
                <div class="deadline-panel" id="deadline-panel-${t.id}">
                    <label>카테고리</label>
                    <input type="text" list="category-list" id="category-input-${t.id}" value="${escapeHtml(t.category || '')}" placeholder="없음" onchange="updateCategory(${t.id}, this.value)">
                    <label>우선순위</label>
                    <select id="priority-input-${t.id}" onchange="updatePriority(${t.id}, this.value)">${priorityOptions(t.priority)}</select>
                    <label>반복</label>
                    <select id="repeat-input-${t.id}" onchange="updateRepeat(${t.id}, this.value)">${repeatOptions(t.repeat)}</select>
                    <label>마감기한</label>
                    <input type="datetime-local" id="deadline-input-${t.id}">
                    <button class="btn-deadline-save" onclick="saveDeadline(${t.id})">저장</button>
                    ${t.deadline ? `<button class="btn-deadline-remove" onclick="removeDeadline(${t.id})">제거</button>` : ''}
                    <textarea id="detail-input-${t.id}" placeholder="메모 (자동 저장)" onchange="updateDetail(${t.id}, this.value)">${escapeHtml(t.detail || '')}</textarea>
                    ${subtaskSection(t)}
                </div>
            </li>`;
        }).join('');
        applyOpenPanels();
    }

    // =====================
    // 타임라인 렌더링
    // =====================
    function renderTimeline() {
        const view = document.getElementById('timeline-view');
        const todosWithDeadline = [...todos]
            .filter(t => t.deadline)
            .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
        if (todosWithDeadline.length === 0) {
            view.innerHTML = `<div class="timeline-empty"><div class="emoji">📅</div><p>마감기한이 설정된 할 일이 없어요!<br>투두에 📅 버튼으로 마감기한을 추가해보세요.</p></div>`;
            return;
        }
        const now = new Date();
        const todayStr = now.toDateString();
        const groups = {};
        todosWithDeadline.forEach(t => {
            const key = new Date(t.deadline).toDateString();
            if (!groups[key]) groups[key] = [];
            groups[key].push(t);
        });
        let html = '';
        Object.entries(groups).forEach(([dateStr, items]) => {
            const groupDate = new Date(dateStr);
            const isPast = groupDate < new Date(now.toDateString());
            const isToday = dateStr === todayStr;
            const labelClass = isPast ? 'overdue-label' : (isToday ? 'today-label' : '');
            const dateLabel = isToday
                ? '오늘'
                : isPast
                    ? `${groupDate.getMonth() + 1}/${groupDate.getDate()} (지남)`
                    : `${groupDate.getMonth() + 1}월 ${groupDate.getDate()}일`;
            html += `<div class="timeline-group">
                <div class="timeline-date-label ${labelClass}">${dateLabel}</div>`;
            items.forEach(t => {
                const d = new Date(t.deadline);
                const timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
                const overdue = isOverdue(t);
                const dotClass  = t.completed ? 'done' : (overdue ? 'overdue' : (isToday ? 'today' : ''));
                const cardClass = t.completed ? 'done' : (overdue ? 'overdue' : '');
                let badge = '';
                if (t.completed)   badge = `<span class="timeline-badge done-badge">✓ 완료</span>`;
                else if (overdue)  badge = `<span class="timeline-badge overdue-badge">⚠️ 마감 초과</span>`;
                else if (isToday)  badge = `<span class="timeline-badge today-badge">오늘 마감</span>`;
                html += `
                <div class="timeline-item">
                    <div class="timeline-line-col">
                        <div class="timeline-dot ${dotClass}"></div>
                    </div>
                    <div class="timeline-card ${cardClass}">
                        <div class="timeline-card-header">
                            <span class="timeline-card-text">${escapeHtml(t.content)}</span>
                            <span class="timeline-time">${timeStr}</span>
                        </div>
                        ${badge}
                    </div>
                </div>`;
            });
            html += `</div>`;
        });
        view.innerHTML = html;
    }

    // =====================
    // 캘린더 렌더링 (월간)
    // =====================
    function dateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function renderCalendar() {
        const view = document.getElementById('calendar-view');
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        const first = new Date(year, month, 1);
        const startDow = first.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayKey = dateKey(new Date());

        // 날짜별 할 일 묶기
        const byDay = {};
        todos.filter(t => t.deadline).forEach(t => {
            const key = dateKey(new Date(t.deadline));
            (byDay[key] = byDay[key] || []).push(t);
        });

        const dows = ['일', '월', '화', '수', '목', '금', '토'];
        let cells = dows.map((d, i) => `<div class="cal-dow ${i === 0 ? 'sun' : (i === 6 ? 'sat' : '')}">${d}</div>`).join('');
        for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell empty"></div>`;
        for (let day = 1; day <= daysInMonth; day++) {
            const d = new Date(year, month, day);
            const key = dateKey(d);
            const dow = d.getDay();
            const items = byDay[key] || [];
            const dots = items.slice(0, 4).map(t => {
                const cls = t.completed ? 'done' : (isOverdue(t) ? 'overdue' : '');
                return `<span class="cal-dot ${cls}"></span>`;
            }).join('');
            const more = items.length > 4 ? `<span class="cal-more">+${items.length - 4}</span>` : '';
            const cls = [key === todayKey ? 'today' : '', key === selectedCalKey ? 'selected' : ''].join(' ');
            const numCls = dow === 0 ? 'sun' : (dow === 6 ? 'sat' : '');
            cells += `<div class="cal-cell ${cls}" onclick="selectCalDay('${key}')">
                <div class="cal-daynum ${numCls}">${day}</div>
                <div class="cal-dot-row">${dots}${more}</div>
            </div>`;
        }

        let selectedHtml = '';
        if (selectedCalKey && byDay[selectedCalKey]) {
            const [sy, sm, sd] = selectedCalKey.split('-');
            selectedHtml = `<div class="cal-selected-list">
                <div class="cal-selected-title">📌 ${parseInt(sm)}월 ${parseInt(sd)}일 (${byDay[selectedCalKey].length}건)</div>
                ${byDay[selectedCalKey].sort((a, b) => new Date(a.deadline) - new Date(b.deadline)).map(t => {
                    const dt = new Date(t.deadline);
                    const time = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
                    const overdue = isOverdue(t);
                    return `<li class="todo-item" style="list-style:none;margin-bottom:6px;">
                        <div class="todo-item-main">
                            <div class="todo-checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTodo(${t.id})"></div>
                            <div class="todo-content">
                                <div class="todo-text ${t.completed ? '' : ''}">${escapeHtml(t.content)}</div>
                                <span class="deadline-chip ${overdue ? 'overdue' : ''}">⏰ ${time}</span>${priorityBadge(t.priority)}${t.category ? `<span class="category-badge">🏷 ${escapeHtml(t.category)}</span>` : ''}
                            </div>
                        </div>
                    </li>`;
                }).join('')}
            </div>`;
        }

        view.innerHTML = `
            <div class="cal-header">
                <div class="cal-title">${year}년 ${month + 1}월</div>
                <div class="cal-nav">
                    <button onclick="calNav(-1)">‹</button>
                    <button onclick="calToday()">오늘</button>
                    <button onclick="calNav(1)">›</button>
                </div>
            </div>
            <div class="cal-grid">${cells}</div>
            ${selectedHtml}`;
    }

    function calNav(delta) {
        calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + delta, 1);
        renderCalendar();
    }
    function calToday() {
        calendarDate = new Date();
        selectedCalKey = dateKey(new Date());
        renderCalendar();
    }
    function selectCalDay(key) {
        selectedCalKey = (selectedCalKey === key) ? null : key;
        renderCalendar();
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function logout() {
        localStorage.removeItem('token');
        todos = [];
        showSection('section-login');
    }

    // =====================
    // 설정 / 데이터 / 계정
    // =====================
    function openSettings() {
        document.getElementById('settings-alert').style.display = 'none';
        document.getElementById('cur-pw').value = '';
        document.getElementById('new-pw').value = '';
        document.getElementById('settings-modal').classList.add('open');
    }
    function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

    // JSON 내보내기
    function exportData() {
        const data = JSON.stringify(todos, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `todolist-backup-${dateKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // JSON 가져오기 (서버에 새 항목으로 추가)
    async function importData(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;
        fileInput.value = '';
        let items;
        try {
            items = JSON.parse(await file.text());
            if (!Array.isArray(items)) throw new Error('형식 오류');
        } catch { showAlert('settings-alert', '올바른 JSON 파일이 아닙니다.'); return; }
        if (!confirm(`${items.length}개 항목을 가져올까요? (현재 목록에 추가됩니다)`)) return;
        const token = localStorage.getItem('token');
        let ok = 0;
        for (const it of items) {
            if (!it.content) continue;
            try {
                const res = await fetch(`${API_BASE}/todos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({
                        content: it.content, deadline: it.deadline || null,
                        category: it.category || null, repeat: it.repeat || 'none',
                        priority: typeof it.priority === 'number' ? it.priority : 1,
                        detail: it.detail || null
                    })
                });
                if (res.ok) ok++;
            } catch (e) { console.error(e); }
        }
        showAlert('settings-alert', `${ok}개 항목을 가져왔습니다.`, 'success');
        loadTodos();
    }

    async function changePassword() {
        const cur = document.getElementById('cur-pw').value;
        const nw = document.getElementById('new-pw').value;
        if (!cur || !nw) { showAlert('settings-alert', '비밀번호를 모두 입력해주세요.'); return; }
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/change-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ current_password: cur, new_password: nw })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('settings-alert', data.detail || '변경 실패'); return; }
            showAlert('settings-alert', '비밀번호가 변경되었습니다.', 'success');
            document.getElementById('cur-pw').value = '';
            document.getElementById('new-pw').value = '';
        } catch { showAlert('settings-alert', '서버 오류'); }
    }

    async function deleteAccount() {
        const pw = prompt('계정을 삭제하려면 비밀번호를 입력하세요.\n(모든 할 일이 영구 삭제됩니다)');
        if (!pw) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`${API_BASE}/account`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ password: pw })
            });
            const data = await res.json();
            if (!res.ok) { showAlert('settings-alert', data.detail || '삭제 실패'); return; }
            alert('계정이 삭제되었습니다.');
            closeSettings();
            logout();
        } catch { showAlert('settings-alert', '서버 오류'); }
    }

    window.onload = () => {
        const token = localStorage.getItem('token');
        if (token) { showSection('section-todo'); loadTodos(); }
    };
</script>
</body>
</html>
